<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedLink AI | Login</title>
    <link rel="stylesheet" href="../static/Login_style.css">
</head>
<body>
    <div class="container">
        <div class="left-side">
            <div class="branding">
                <h1>MedLink AI</h1>
                <p>Advanced Demand Forecasting. Utilizing LSTM models to optimize medical supply chains.</p>
                <div class="stats-badge">Neural Network Status: Active</div>
            </div>
        </div>
        <div class="right-side">
            <div class="glass-card">
                <form id="loginForm">
                    <h2>Welcome Back</h2>
                    <p class="subtitle">Enter your credentials.</p>
                    <div class="input-group">
                        <label>Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="pass" required>
                    </div>
                    <div class="form-options">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>
                    <div class="form-button">
                        <button type="submit" class="login-btn" id="btn">Sign In</button>
                    </div>
                    <div>
                        <p class="signup-text">New here? <a href="register.html">Create Account</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.innerText = "Authenticating...";
            btn.disabled = true;
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1500);
        });
    </script>
</body>
</html>
